[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-vlm"
version = "0.0.1"
description = "Vietnamese receipt key-information extraction: OCR pipeline vs zero-shot vs LoRA-fine-tuned VLMs, served with vLLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pillow>=10.0", "numpy"]

[project.optional-dependencies]
# Heavy stacks are installed per Kaggle session, not together (they pin different torch versions).
serve = ["vllm>=0.11.0"]
train = ["unsloth", "trl", "peft", "bitsandbytes"]
dev = ["pytest>=8", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
